# Optional private OCI signing profile mounted read-only; never put it in this repository.
# Use: docker compose --project-directory . -f lapi_local_use/compose.yaml -f lapi_local_use/compose.oci-profile.yaml up --build -d
# OCI config's key_file path must be /run/oci/private_key.pem.
services:
  api:
    volumes:
      - ${LAPI_OCI_PROFILE_DIR:?Set an absolute private OCI profile directory}:/run/oci:ro
  worker:
    volumes:
      - ${LAPI_OCI_PROFILE_DIR:?Set an absolute private OCI profile directory}:/run/oci:ro
