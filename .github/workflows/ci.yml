name: Validate Lapi
on:
  push:
    branches: [main, lapi_sprint1]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            lapi_backend/requirements*.txt
            lapi_testing/backend/requirements.txt
      - run: pip install -r lapi_testing/backend/requirements.txt
      - run: python -B lapi_testing/run_backend_tests.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lapi_frontend/package-lock.json
      - run: npm ci
        working-directory: lapi_frontend
      - run: npm run test:unit && npm run typecheck && npm run build
        working-directory: lapi_frontend
  local-embedding-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the default laptop image with CPU embeddings
        run: docker build --build-arg INSTALL_LOCAL_EMBEDDINGS=true -t lapi-local-embedding ./lapi_backend
      - name: Run real local inference inside the default image
        run: |
          docker run --rm --entrypoint python -e HF_HOME=/data/model-cache lapi-local-embedding -c "from lapi_app.providers import embed; vectors=embed(['Lapi keeps original documents in storage.', 'A separate sample sentence.']); assert len(vectors)==2 and all(len(v)==384 for v in vectors); assert all(abs(sum(x*x for x in v)-1)<0.01 for v in vectors); print('PASS: real normalized local embeddings in default Docker image')"
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAPI_SMOKE_PASSWORD: Lapi-CI-only-disposable-password
      COMPOSE_FILE: lapi_local_use/compose.yaml:lapi_testing/compose.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated test configuration
        run: |
          ./lapi_local_use/lapi_scripts/setup.sh
          cat >> .env <<'CONFIG'
          MODEL_PROVIDER=mock
          EMBEDDING_PROVIDER=mock
          LAPI_ALLOW_MOCK=true
          INSTALL_LOCAL_EMBEDDINGS=false
          CONFIG
      - run: docker compose --project-directory . config --quiet
      - run: docker compose --project-directory . up --build -d --wait --wait-timeout 180
      - name: Exercise durable document workflows
        id: smoke
        run: python lapi_testing/scripts/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lapi_frontend/package-lock.json
      - name: Install browser interaction test tools
        working-directory: lapi_frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Exercise browser workflows
        working-directory: lapi_frontend
        run: npm run test:e2e
      - name: Capture actual app screens with synthetic demo data
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        working-directory: lapi_frontend
        env:
          LAPI_CAPTURE_SCREENSHOTS: 'true'
        run: npm run test:screenshots
      - name: Save requested app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapi-ui-screens
          path: lapi_runtime/lapi_screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose --project-directory . logs --no-color --tail=150
      - name: Shut down ephemeral deployment
        if: always()
        run: docker compose --project-directory . down -v
