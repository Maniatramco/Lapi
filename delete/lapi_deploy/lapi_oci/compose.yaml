# Lapi on one OCI Always Free VM (Ampere A1, arm64).
# Database: the separate Lapi Always Free Autonomous Database (TLS, IP allow-list).
# Secrets live only on the VM under /opt/lapi/secrets and are never committed.
name: lapi

x-backend: &backend
  build:
    context: ../../lapi_backend
    args:
      INSTALL_ORACLE: 'true'
      INSTALL_LOCAL_EMBEDDINGS: 'false'
      INSTALL_CLOUD_MODELS: 'false'
  image: lapi-backend:local
  restart: unless-stopped
  env_file: [/opt/lapi/secrets/lapi.env]
  environment: &backend-env
    DATABASE_PROVIDER: oracle
    TNS_ADMIN: /run/lapi/tns
    LAPI_STORAGE_ROOT: /data
    LAPI_CONFIG_FILE: /etc/lapi/runtime.toml
    LAPI_CONFIG_PROFILE: local
    QDRANT_URL: http://qdrant:6333
    SEARCH_PROVIDER: qdrant
    MODEL_PROVIDER: ollama
    EMBEDDING_PROVIDER: ollama
    LAPI_MODEL: ${LAPI_MODEL:-qwen3:4b}
    EMBEDDING_MODEL: nomic-embed-text
    LAPI_OLLAMA_URL: http://ollama:11434
    LAPI_OLLAMA_ENDPOINT_HOSTS: ollama
    LAPI_ALLOW_MOCK: 'false'
    LAPI_AGENT_ENGINE: langgraph
    # auto = agentic chat for cloud function-calling models (e.g. Gemini), router for the local model
    LAPI_CHAT_MODE: ${LAPI_CHAT_MODE:-auto}
    LAPI_OCR_ENABLED: 'false'
    LANGSMITH_TRACING: 'false'
    API_INTERNAL_URL: http://api:8000
  volumes:
    - storage:/data
    - ../../lapi_backend/lapi_app/lapi_config/runtime.toml:/etc/lapi/runtime.toml:ro
    - /opt/lapi/secrets/tns:/run/lapi/tns:ro
  networks: [private, outbound]
  depends_on:
    qdrant:
      condition: service_started
    ollama:
      condition: service_healthy

services:
  web:
    build: ../../lapi_frontend
    image: lapi-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      LAPI_DEPLOYMENT_TARGET: local
      LAPI_API_LOCATION: local
      LAPI_WORKER_LOCATION: local
      LAPI_MODEL_LOCATION: local
    ports:
      - '80:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/auth/status').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [private, edge]
  api:
    <<: *backend
    command: uvicorn lapi_app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 40s
  worker:
    <<: *backend
    command: python -m lapi_app.worker
    depends_on:
      api:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes: [qdrant:/qdrant/storage]
    networks: [private]
  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: '30m'
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [private, outbound]

volumes:
  storage:
  qdrant:
  ollama:

networks:
  private:
    internal: true
  outbound: {}
  edge: {}
